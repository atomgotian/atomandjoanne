<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Countdown — Atom &amp; Joanne</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:image" content="https://atomandjoanne.com/photos/hero/hero-full.jpeg">
<link rel="icon" type="image/png" href="../photos/event-details/illustration-dance.png">

<style>
  /* Same colour tokens and fonts as the main site (index.html) */
  :root{
    --bg:        #F5F0F2;
    --cream:     #FDF8F6;
    --ink-soft:  #9A6580;
    --ink:       #472E3B;
    --accent:    #A5CCE6;
    --accent-deep: #2D74A4;

    /* Alternating month colours for the calendar tiles */
    --month-a-bg:     #FDF8F6;                  /* Oct, Dec, Feb — cream */
    --month-a-border: rgba(165,204,230,0.45);
    --month-b-bg:     #F8F1F3;                /* Nov, Jan — slightly deeper blush */
    --month-b-border: rgba(154,101,128,0.18);
  }
  @font-face{ font-family:'Joanne Hand';  src:url('../fonts/Myfont8-Regular.otf') format('opentype'); font-weight:800; font-display:swap; }
  @font-face{ font-family:'Joanne Print'; src:url('../fonts/Myfont5-Regular.otf') format('opentype'); font-weight:400; font-display:swap; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; overflow-x:hidden; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Joanne Print', sans-serif;
    letter-spacing:0.1em;
    line-height:1.6;
  }

  .wrap{ max-width:640px; margin:0 auto; padding:56px 16px 140px; }   /* top room so the pinned Home button doesn't cover the countdown */

  /* ---------- Back button (same as pegs & prenup; stays pinned top-left while scrolling) ---------- */
  .back-btn{
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.1rem 0.55rem 0.85rem;
    border-radius: 9999px;
    background: var(--cream);
    color: var(--ink-soft);
    border: 1.5px solid var(--accent);
    font-family: 'Joanne Print', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 2px 5px rgba(74,54,72,0.12), 0 8px 16px rgba(74,54,72,0.12);
    transition: transform 0.25s cubic-bezier(0.34,1.4,0.64,1), background-color 0.25s ease, color 0.25s ease;
  }
  .back-btn:hover{ background: var(--accent-deep); color: var(--cream); transform: translateY(-2px); }
  .back-btn:focus-visible{ outline: 2px solid var(--accent-deep); outline-offset: 3px; }
  .back-btn svg{ width: 16px; height: 16px; }

  /* ---------- Header countdown ---------- */
  header{ text-align:center; margin:28px 0 32px; }
  .eyebrow{ color:var(--ink-soft); font-size:15px; margin:0 0 6px; }
  .big{
    font-family:'Joanne Hand', cursive;
    font-size:clamp(72px, 22vw, 140px);
    line-height:1;
    letter-spacing:-0.03em;
    margin:0;
    color:var(--ink);
  }
  .sub{
    font-family:'Joanne Hand', cursive;
    font-size:clamp(24px, 6vw, 34px);
    letter-spacing:-0.02em;
    margin:6px 0 0;
  }
  .breakdown{
    font-size:clamp(13px, 3.4vw, 15px);
    color:var(--ink-soft);
    margin:4px 0 0;
  }
  .breakdown:empty{ display:none; }

  /* ---------- Grid: 7 columns (Sun → Sat) × 20 rows ---------- */
  .weekdays, .grid{
    display:grid;
    grid-template-columns:repeat(7, minmax(0, 1fr));   /* minmax(0,…) = all 7 columns stay equal, even with the big sticker in Saturday */
    gap:6px;
  }
  .weekdays{ margin-bottom:6px; }
  .weekdays span{ text-align:center; font-size:12px; color:var(--ink-soft); }

  .tile{
    position:relative;
    aspect-ratio:1 / 1;
    border-radius:6px;
    overflow:hidden;
    background:var(--month-a-bg);
    border:1px solid var(--month-a-border);
    display:flex; align-items:center; justify-content:center;
    padding:0;
    font:inherit; color:inherit;
  }
  .tile.month-b{
    background:var(--month-b-bg);
    border-color:var(--month-b-border);
  }
  .tile .date{
    font-size:clamp(8px, 2.2vw, 11px);
    letter-spacing:0.04em;
    color:var(--ink-soft);
    opacity:0.6;
    text-align:center;
    line-height:1.2;
  }
  .tile img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;              /* square crop in the grid */
    opacity:0; transition:opacity .5s ease;
  }
  .tile.loaded img{ opacity:1; }
  .tile.loaded{ cursor:zoom-in; border-color:transparent; }
  .tile.loaded .date{ display:none; }
  .tile.loaded:hover img{ transform:scale(1.04); transition:transform .3s ease, opacity .5s ease; }
  .tile:focus-visible{ outline:2px solid var(--accent-deep); outline-offset:2px; }

  .tile.revealed:not(.loaded) .date{ opacity:0.9; }   /* day has come, photo not uploaded yet */
  .tile.today{ box-shadow:0 0 0 2px var(--accent); }
  .tile.wedding{ border:2px solid var(--accent-deep); }
  .tile.wedding .date{ color:var(--accent-deep); opacity:1; font-weight:600; }
  /* Date label on top, sticker underneath — both kept inside the tile, sized to it */
  .tile.wedding:not(.loaded) .date{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .tile img.wedding-sticker{ position:static; display:block; width:100%; height:auto; margin:-40% auto 0; opacity:1; object-fit:contain; transform:translateY(0); }
  /* The sticker's picture box is wider than the two of you (Atom's arm stretches left),
     so spin around where the bodies are, not the middle of the box. Tweak these two % if needed. */
  .tile img.wedding-sticker{ transform-origin:68% 64%; }
  .tile.wedding:not(.loaded){ cursor:pointer; overflow:visible; }
  .tile.wedding:not(.loaded):hover img.wedding-sticker{ transform:translateY(0) rotate(-8deg) scale(1.06); transition:transform .25s ease; }

  /* ---------- Wedding tile tap: speech bubble + red circle on 1 Dec ----------
     Tap the sticker → it spins → a bubble pops up saying "Please RSVP by Dec 1!"
     → a red marker circle draws itself around the 1 Dec tile. */
  .grid{ position:relative; }            /* bubble + circle are placed relative to the grid */
  .rsvp-bubble{
    position:absolute; z-index:5;
    background:var(--cream);
    color:var(--ink);
    border:1.5px solid var(--ink-soft);
    border-radius:16px;
    padding:8px 14px;
    font-family:'Joanne Print', sans-serif;   /* same font as the tile dates */
    font-size:clamp(13px, 3.6vw, 16px);
    letter-spacing:0.08em;
    line-height:1.3;
    white-space:nowrap;
    box-shadow:0 4px 14px rgba(74,54,72,0.18);
    transform-origin:90% 0%;              /* grows out of the tail, near the sticker */
  }
  .rsvp-bubble a{ color:var(--accent-deep); text-decoration:underline; text-underline-offset:3px; }
  .rsvp-bubble a:hover{ color:var(--ink); }
  .rsvp-bubble::after{                    /* the little tail pointing up at the sticker */
    content:''; position:absolute;
    right:18px; top:-8px;
    width:14px; height:14px;
    background:var(--cream);
    border-left:1.5px solid var(--ink-soft);
    border-top:1.5px solid var(--ink-soft);
    transform:rotate(45deg);
  }
  .rsvp-circle{
    position:absolute; z-index:4;
    pointer-events:none; overflow:visible;
  }
  .rsvp-circle path{
    fill:none;
    stroke:#D6453D;                       /* red marker */
    stroke-width:2.8;                     /* thickness of the marker line */
    stroke-linecap:round;
  }

  /* ---------- Lightbox (photo shown at its original shape) ---------- */
  .lb{
    position:fixed; inset:0; z-index:100;
    background:rgba(40,25,33,0.92);
    display:none; align-items:center; justify-content:center;
    touch-action:pan-y;
  }
  .lb.open{ display:flex; }
  .lb img{
    max-width:92vw; max-height:84vh;
    width:auto; height:auto;
    object-fit:contain;
    border-radius:4px;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
    user-select:none; -webkit-user-drag:none;
  }
  .lb button{
    position:absolute;
    background:none; border:none; cursor:pointer;
    color:#fff; opacity:0.85;
    font-size:34px; line-height:1;
    padding:14px;
  }
  .lb button:hover{ opacity:1; }
  .lb .close{ top:8px; right:8px; }
  .lb .prev{ left:4px; top:50%; transform:translateY(-50%); }
  .lb .next{ right:4px; top:50%; transform:translateY(-50%); }
  .lb .caption{
    position:absolute; bottom:16px; left:0; right:0;
    text-align:center; color:#fff; opacity:0.8; font-size:13px;
  }
  @media (max-width:640px){ .lb .prev, .lb .next{ display:none; } } /* swipe on phones */

  /* ---------- Corner pieces (same as the main site) ----------
     Panda bottom-right spins as you scroll; "Atom & Joanne" bottom-left.
     Copied from index.html. Always visible here (no hero to scroll past). */
  #scroll-panda{
    position: fixed;
    right: clamp(0.75rem, 5vw, 1.75rem);
    bottom: clamp(0.75rem, 5vw, 1.75rem);
    width: clamp(4rem, 9vw, 6rem);
    height: auto;
    z-index: 60;
    filter: drop-shadow(0 6px 14px rgba(74,54,72,0.28));
    pointer-events: auto;     /* clickable: tap for fireworks */
    cursor: pointer;
    will-change: transform;
  }
  @media (max-width: 639px){
    #scroll-panda{ bottom: 0.5rem; }
  }
  #corner-signature{
    position: fixed;
    left: clamp(0.75rem, 5vw, 1.75rem);
    bottom: clamp(1rem, 5vw, 2rem);
    z-index: 60;
    font-family: 'Joanne Hand', cursive;
    font-weight: 800;
    letter-spacing: normal;
    color: var(--ink);
    line-height: 1;
    text-align: center;
    filter: drop-shadow(0 4px 10px rgba(74,54,72,0.22));
    pointer-events: none;
  }
  #corner-signature .corner-signature-name{ display: block; font-size: clamp(1rem, 3vw, 2rem); }
  #corner-signature .corner-signature-and{ display: block; font-size: clamp(0.65rem, 2vw, 1rem); margin: -0.1em 0; }
</style>
</head>
<body>
  <!-- Corner pieces (same as the main site) -->
  <img id="scroll-panda" src="../photos/hero/panda.png" alt="" aria-hidden="true" />
  <div id="corner-signature" aria-hidden="true">
    <span class="corner-signature-name">Atom</span>
    <span class="corner-signature-and">&amp;</span>
    <span class="corner-signature-name">Joanne</span>
  </div>

  <!-- "../" = the site's home page (one folder up from /countdown/) -->
  <a href="../" class="back-btn" aria-label="Back to the home page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Home
  </a>

  <div class="wrap">

    <header>
      <p class="big" id="big">&nbsp;</p>
      <p class="sub" id="sub">&nbsp;</p>
      <p class="breakdown" id="breakdown"></p>
    </header>

    <div class="weekdays" aria-hidden="true">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="close" id="lb-close" aria-label="Close">&times;</button>
    <button class="prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <img id="lb-img" alt="">
    <button class="next" id="lb-next" aria-label="Next photo">&#8250;</button>
    <p class="caption" id="lb-cap"></p>
  </div>

<script>
(function(){
  // ------------------------------------------------------------------
  // HOW THIS WORKS
  // Each tile is one calendar day. Its number = sleeps left on that day.
  //   Top-left  = Thu 1 Oct 2026  = 142   -> photos/countdown/142.jpg
  //   Bottom-right = Sat 20 Feb 2027 = 0  -> photos/countdown/0.jpg
  // A tile reveals once that day arrives (Manila time). The page looks for
  // N.jpg first, then N.png. If neither exists, the tile just shows its date.
  //
  // Months alternate between cream and a slightly deeper blush so you can tell
  // where one month ends and the next begins.
  //
  // Preview trick: add ?sleeps=50 to the URL to see the page as it will
  // look when there are 50 sleeps left.
  // ------------------------------------------------------------------
  const TOTAL = 143;
  const WEDDING_UTC = Date.UTC(2027, 1, 20);   // 20 Feb 2027 (month is 0-based)
  const DAY = 86400000;
  const PHOTO_DIR = '../photos/countdown/';
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Today's date in Manila, as a plain calendar date
  function manilaTodayUTC(){
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone:'Asia/Manila', year:'numeric', month:'2-digit', day:'2-digit'
    }).format(new Date()).split('-').map(Number);
    return Date.UTC(parts[0], parts[1] - 1, parts[2]);
  }
  function sleepsLeft(){
    const override = new URLSearchParams(location.search).get('sleeps');
    if (override !== null && override !== '' && !isNaN(override)) return parseInt(override, 10);
    return Math.round((WEDDING_UTC - manilaTodayUTC()) / DAY);
  }

  // How many whole calendar months + leftover days between "s sleeps left" and the wedding
  // e.g. 17 Oct 2026 -> 20 Feb 2027 = 4 months, 3 days
  function monthsAndDays(s){
    const from = new Date(WEDDING_UTC - s * DAY);
    const to   = new Date(WEDDING_UTC);
    let months = (to.getUTCFullYear() - from.getUTCFullYear()) * 12
               + (to.getUTCMonth() - from.getUTCMonth());
    if (from.getUTCDate() > to.getUTCDate()) months--;
    // Step forward that many months from the start date (keeping the day in range)
    const y = from.getUTCFullYear(), m = from.getUTCMonth() + months;
    const lastDay = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    const anchor = Date.UTC(y, m, Math.min(from.getUTCDate(), lastDay));
    const days = Math.round((WEDDING_UTC - anchor) / DAY);
    return { months, days };
  }
  function breakdownText(s){
    const { months, days } = monthsAndDays(s);
    const bits = [];
    if (months > 0) bits.push(months + (months === 1 ? ' month' : ' months'));
    if (days > 0)   bits.push(days + (days === 1 ? ' day' : ' days'));
    return '(' + bits.join(', ') + ')';
  }

  // ---------- Header ----------
  function renderHeader(s){
    const big = document.getElementById('big');
    const sub = document.getElementById('sub');
    const bd  = document.getElementById('breakdown');
    if (s > 0){
      big.textContent = s;
      sub.textContent = (s === 1 ? 'sleep' : 'sleeps') + ' until our day!';
      bd.textContent  = breakdownText(s);
    } else if (s === 0){
      big.textContent = 'Today!';
      sub.textContent = 'Today’s the day ♡';
      bd.textContent  = '';
    } else {
      big.textContent = 'Married!';
      sub.textContent = '20.02.2027';
      bd.textContent  = '';
    }
  }

  // ---------- Grid ----------
  const grid = document.getElementById('grid');
  const tiles = [];

  function buildGrid(){
    for (let k = 0; k < 4; k++){              // empty spaces: Sun–Wed before Thu 1 Oct
      const sp = document.createElement('div');
      sp.setAttribute('aria-hidden', 'true');
      grid.appendChild(sp);
    }
    for (let i = 0; i < TOTAL; i++){
      const n = TOTAL - 1 - i;                    // 142 ... 0
      const d = new Date(WEDDING_UTC - n * DAY);
      const label = d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
      const monthClass = (d.getUTCMonth() % 2 === 0) ? ' month-b' : ' month-a';   // Nov & Jan blush; Oct, Dec, Feb cream

      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile' + monthClass + (n === 0 ? ' wedding' : '');
      tile.dataset.n = n;
      tile.dataset.label = label;
      tile.tabIndex = (n === 0) ? 0 : -1;
      tile.setAttribute('aria-label', n === 0 ? 'Our wedding day, ' + label : label);
      tile.innerHTML = '<span class="date">' + (n === 0 ? label + '<img class="wedding-sticker" src="../photos/hero/sticker-taiwan-outline.png" alt="">' : label) + '</span>';
      grid.appendChild(tile);
      tiles.push(tile);
    }
  }

  function loadPhoto(tile){
    if (tile.dataset.tried) return;
    tile.dataset.tried = '1';
    const n = tile.dataset.n;
    const img = new Image();
    img.alt = 'Photo for ' + tile.dataset.label;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.onload = () => {
      tile.classList.add('loaded');
      tile.tabIndex = 0;
      tile.setAttribute('aria-label', 'Open photo for ' + tile.dataset.label);
    };
    img.onerror = () => {
      if (img.src.endsWith('.jpg')) img.src = PHOTO_DIR + n + '.png';   // try .png next
      else img.remove();                                                 // no photo yet
    };
    img.src = PHOTO_DIR + n + '.jpg';
    tile.appendChild(img);
  }

  function renderGrid(s){
    tiles.forEach(tile => {
      const n = parseInt(tile.dataset.n, 10);
      tile.classList.toggle('today', n === s);
      if (n >= s){                       // that day has arrived
        tile.classList.add('revealed');
        loadPhoto(tile);
      }
    });
  }

  // ---------- Lightbox ----------
  const lb = document.getElementById('lb');
  const lbImg = document.getElementById('lb-img');
  const lbCap = document.getElementById('lb-cap');
  let seq = [], pos = 0, lastFocus = null;

  function show(){
    const tile = seq[pos];
    const src = tile.querySelector('img:not(.wedding-sticker)').src;
    lbImg.src = src;
    lbImg.alt = 'Photo for ' + tile.dataset.label;
    lbCap.textContent = tile.dataset.label;
  }
  function open(tile){
    seq = tiles.filter(t => t.classList.contains('loaded'));   // grid order
    pos = seq.indexOf(tile);
    if (pos < 0) return;
    lastFocus = tile;
    show();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }
  function close(){
    lb.classList.remove('open');
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }
  function step(dir){
    if (seq.length < 2) return;
    pos = (pos + dir + seq.length) % seq.length;
    show();
  }

  // ---------- Wedding tile: spin the sticker, bubble, then circle 1 Dec ----------
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Bubble words. The <a> part becomes the link to the RSVP form on the home page.
  const RSVP_HTML = 'Please <a href="../#rsvp">RSVP</a> by Dec 1!';
  const RSVP_TILE_LABEL = '1 Dec';          // the tile that gets circled
  let spinning = false, hideTimer = null, bubble = null, circle = null;

  function clearRsvp(){
    clearTimeout(hideTimer);
    [bubble, circle].forEach(el => { if (el) el.remove(); });
    bubble = circle = null;
  }

  // Speech bubble sitting just above the wedding tile, tail pointing at the sticker
  function showBubble(tile){
    bubble = document.createElement('div');
    bubble.className = 'rsvp-bubble';
    bubble.setAttribute('role', 'status');
    bubble.innerHTML = RSVP_HTML;
    grid.appendChild(bubble);
    const right = grid.clientWidth - (tile.offsetLeft + tile.offsetWidth);
    bubble.style.right  = right + 'px';
    bubble.style.top   = (tile.offsetTop + tile.offsetHeight + 12) + 'px';   // sits just under the 20 Feb tile
    if (!reduceMotion){
      bubble.animate(
        [ { transform:'scale(0.3)', opacity:0 }, { transform:'scale(1.08)', opacity:1, offset:0.7 }, { transform:'scale(1)', opacity:1 } ],
        { duration:350, easing:'ease-out' }
      );
    }
  }

  // Hand-drawn red circle around the 1 Dec tile (draws itself like a marker)
  function circleDeadline(){
    const t = tiles.find(x => x.dataset.label === RSVP_TILE_LABEL);
    if (!t) return;
    const pad = t.offsetWidth * 0.28;       // how far the circle reaches past the tile
    const NS = 'http://www.w3.org/2000/svg';
    circle = document.createElementNS(NS, 'svg');
    circle.setAttribute('class', 'rsvp-circle');
    circle.setAttribute('viewBox', '0 0 100 100');
    circle.setAttribute('preserveAspectRatio', 'none');
    circle.setAttribute('aria-hidden', 'true');
    Object.assign(circle.style, {
      left: (t.offsetLeft - pad) + 'px', top: (t.offsetTop - pad) + 'px',
      width: (t.offsetWidth + pad * 2) + 'px', height: (t.offsetHeight + pad * 2) + 'px',
    });
    const path = document.createElementNS(NS, 'path');
    // slightly wonky loop that overshoots where it started, like a real pen
    path.setAttribute('d', 'M 72 10 C 40 2, 6 16, 8 52 C 10 88, 52 98, 82 86 C 100 76, 98 30, 74 14 C 66 9, 56 8, 48 10');
    circle.appendChild(path);
    grid.appendChild(circle);
    if (!reduceMotion){
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.animate([ { strokeDashoffset:len }, { strokeDashoffset:0 } ], { duration:700, easing:'ease-in-out', fill:'both' });
    }
    // On phones 1 Dec may be off-screen: bring it into view
    const r = t.getBoundingClientRect();
    if (r.top < 70 || r.bottom > window.innerHeight){
      t.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block:'center' });
    }
  }

  function playRsvp(tile){
    clearRsvp();
    showBubble(tile);
    hideTimer = setTimeout(circleDeadline, reduceMotion ? 0 : 1300);   // time to read the bubble first
  }

  function spinThenRsvp(tile){
    if (spinning) return;
    const sticker = tile.querySelector('.wedding-sticker');
    if (!sticker || reduceMotion){ playRsvp(tile); return; }
    spinning = true;
    sticker.animate(
      [
        { transform:'translateY(0) rotate(0deg) scale(1)' },
        { transform:'translateY(0) rotate(380deg) scale(1.2)', offset:0.75 },
        { transform:'translateY(0) rotate(350deg) scale(1.1)', offset:0.88 },
        { transform:'translateY(0) rotate(360deg) scale(1)' },
      ],
      { duration:650, easing:'cubic-bezier(.3,.7,.4,1)' }
    ).finished.then(() => { spinning = false; playRsvp(tile); }).catch(() => { spinning = false; });
  }
  window.addEventListener('resize', clearRsvp);   // positions would be off after a resize

  grid.addEventListener('click', e => {
    const tile = e.target.closest('.tile.loaded');
    if (tile){ open(tile); return; }
    const wed = e.target.closest('.tile.wedding');
    if (wed) spinThenRsvp(wed);
  });
  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); step(-1); });
  document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); step(1); });
  lb.addEventListener('click', e => { if (e.target === lb) close(); });   // tap the dark background to close
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  // Swipe left / right on phones
  let x0 = null, y0 = null;
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  lb.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  });

  // ---------- Go ----------
  buildGrid();
  let current = sleepsLeft();
  renderHeader(current);
  renderGrid(current);

  // Tick over at Manila midnight if the page is left open
  setInterval(() => {
    const s = sleepsLeft();
    if (s !== current){ current = s; renderHeader(s); renderGrid(s); }
  }, 60000);
})();
</script>
<script>
  // Panda spins with scroll position (same speed as the main site)
  (function(){
    const panda = document.getElementById('scroll-panda');
    if (!panda || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const spin = () => { panda.style.transform = 'rotate(' + (window.scrollY * 0.5) + 'deg)'; };
    window.addEventListener('scroll', spin, { passive: true });
    spin();
  })();
</script>
<script>
  // ---------- Panda sticker: click easter egg (same as the main site) ----------
  // Every click: the panda squishes and a small firework pops out of it.
  // Every 5th click: a big screen-wide fireworks celebration.
  (function(){
    const panda = document.getElementById('scroll-panda');
    if (!panda) return;
    const FIREWORK_IMG = '../photos/event-details/illustration-fireworks.png';
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const BIG_EVERY = 5;
    let clicks = 0;

    const overlay = document.createElement('div');
    overlay.setAttribute('aria-hidden', 'true');
    overlay.style.cssText = 'position:fixed; inset:0; z-index:150; pointer-events:none; overflow:hidden;';
    document.body.appendChild(overlay);

    function burst(x, y, size, duration){
      const rotation = Math.random() * 360;
      const img = document.createElement('img');
      img.src = FIREWORK_IMG;
      img.alt = '';
      img.style.cssText = `position:absolute; left:${x}px; top:${y}px; width:${size}px; height:${size}px; opacity:0;`;
      overlay.appendChild(img);
      img.animate(
        [
          { transform: `translate(-50%, -50%) scale(0.3) rotate(${rotation}deg)`, opacity: 0 },
          { transform: `translate(-50%, -50%) scale(1) rotate(${rotation}deg)`, opacity: 1, offset: 0.35 },
          { transform: `translate(-50%, -50%) scale(1.15) rotate(${rotation}deg)`, opacity: 0 },
        ],
        { duration, easing: 'ease-out', fill: 'forwards' }
      ).finished.then(() => img.remove()).catch(() => {});
    }
    const small = (x, y) => burst(x, y, 90 + Math.random() * 60, 1100);
    const big   = (x, y) => burst(x, y, 260 + Math.random() * 160, 1600);

    panda.addEventListener('click', () => {
      clicks++;
      if (reduceMotion) return;
      panda.animate(
        [
          { scale: '1 1' },
          { scale: '1.25 0.75', offset: 0.25 },
          { scale: '0.9 1.15', offset: 0.55 },
          { scale: '1.05 0.95', offset: 0.8 },
          { scale: '1 1' },
        ],
        { duration: 500, easing: 'ease-out' }
      );
      const r = panda.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      small(cx - 20 - Math.random() * 50, cy - 50 - Math.random() * 40);
      setTimeout(() => small(cx - 60 - Math.random() * 40, cy - 10 - Math.random() * 40), 140);
      if (clicks % BIG_EVERY === 0){
        const w = window.innerWidth, h = window.innerHeight;
        for (let i = 0; i < 12; i++){
          setTimeout(() => big(w * (0.1 + Math.random() * 0.8), h * (0.1 + Math.random() * 0.7)), i * 120 + Math.random() * 80);
        }
      }
    });
  })();
</script>
