<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Prenup — Atom &amp; Joanne</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:image" content="https://atomandjoanne.com/photos/our-story/our-story-hero.jpeg">
<link rel="icon" type="image/png" href="../photos/event-details/illustration-dance.png">
<style>
  :root{
    --bg:        #F5F0F2;
    --cream:     #FDF8F6;
    --ink-soft:  #9A6580;
    --ink:       #472E3B;
    --accent:    #A5CCE6;
    --accent-deep: #2D74A4;
  }

  /* Same fonts as the main site. Paths are ../ because this page lives one
     folder down, in /prenup/. */
  @font-face{
    font-family: 'Joanne Hand';
    src: url('../fonts/Myfont8-Regular.otf') format('opentype');
    font-weight: 800; font-style: normal; font-display: swap;
  }
  @font-face{
    font-family: 'Joanne Print';
    src: url('../fonts/Myfont5-Regular.otf') format('opentype');
    font-weight: 400; font-style: normal; font-display: swap;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ overflow-x: hidden; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Joanne Print', sans-serif;
    letter-spacing: 0.1em;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* ---------- Back button (stays pinned top-left while scrolling) ---------- */
  .back-btn{
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.1rem 0.55rem 0.85rem;
    border-radius: 9999px;
    background: var(--cream);
    color: var(--ink-soft);
    border: 1.5px solid var(--accent);
    font-family: 'Joanne Print', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 2px 5px rgba(74,54,72,0.12), 0 8px 16px rgba(74,54,72,0.12);
    transition: transform 0.25s cubic-bezier(0.34,1.4,0.64,1), background-color 0.25s ease, color 0.25s ease;
  }
  .back-btn:hover{ background: var(--accent-deep); color: var(--cream); transform: translateY(-2px); }
  .back-btn:focus-visible{ outline: 2px solid var(--accent-deep); outline-offset: 3px; }
  .back-btn svg{ width: 16px; height: 16px; }

  /* ---------- Header ---------- */
  .page-header{
    text-align: center;
    padding: 5.5rem 1.5rem 2rem;
  }
  .page-label{
    margin: 0 0 1rem;
    font-size: 16px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .page-title{
    margin: 0;
    font-family: 'Joanne Hand', cursive;
    font-weight: 800;
    font-size: clamp(2.6rem, 7vw, 3.75rem);
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--ink);
  }

  /* ---------- Gallery: tidy 2-to-1 grid ----------
    Every landscape photo is one row tall; every portrait photo is exactly
    two rows tall (so it lines up with two landscapes stacked beside it).
    Row height comes from the column width (set by sizeRows() in the script),
    so it stays exact at any screen size. Portraits are cropped very slightly
    top and bottom to fit — the expanded view always shows the full photo.
    --gap sets the space between photos (both directions). */
  .gallery{
    --gap: 0.4rem;             /* phones: tighter gap so 3 columns still have room */
    max-width: 64rem;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;   /* 1.5rem side gap = same as the main site on mobile */
    display: grid;
    grid-template-columns: repeat(3, 1fr);   /* 3 columns on every screen size */
    grid-auto-rows: 220px;     /* placeholder — replaced by sizeRows() */
    grid-auto-flow: row dense; /* fills any hole a portrait leaves with the next photo that fits */
    gap: var(--gap);
  }
  @media (min-width: 768px){ .gallery{ --gap: 1rem; } }
  /* phones: thinner white border so the small tiles are mostly photo */
  @media (max-width: 767px){ .gallery-item{ padding: 0.15rem; } }
  .gallery-item.is-portrait{ grid-row: span 2; }

  .gallery-item{
    margin: 0;
    background: #fff;
    padding: 0.3rem;          /* thin white print border, like the story photos */
    box-shadow: 0 2px 5px rgba(74,54,72,0.14), 0 14px 26px rgba(74,54,72,0.16);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  .gallery-item.is-in{ opacity: 1; transform: none; }
  .gallery-item img{ width: 100%; height: 100%; object-fit: cover; display: block; }

  .gallery-empty{
    text-align: center;
    color: var(--ink-soft);
    padding: 2rem 1.5rem 4rem;
  }

  /* ---------- Hover: photo lifts and gently zooms inside its frame ---------- */
  .gallery-item{ cursor: zoom-in; overflow: hidden; position: relative; }
  .gallery-item img{ transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), filter 0.4s ease; }
  .gallery-item.is-in{ transition: opacity 0.6s ease, transform 0.35s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.35s ease; }
  @media (hover: hover) and (pointer: fine){
    .gallery-item.is-in:hover{
      transform: translateY(-6px) rotate(-0.6deg);
      box-shadow: 0 4px 10px rgba(74,54,72,0.16), 0 22px 40px rgba(74,54,72,0.22);
    }
    .gallery-item:nth-child(even).is-in:hover{ transform: translateY(-6px) rotate(0.6deg); }
    .gallery-item:hover img{ transform: scale(1.04); filter: brightness(1.04); }
  }
  .gallery-item:focus-visible{ outline: 2px solid var(--accent-deep); outline-offset: 4px; }

  /* ---------- Lightbox (expanded photo viewer) ---------- */
  .lightbox{
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(40,26,34,0.92);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0s linear 0.3s;
    touch-action: none;          /* we handle swipe + pinch-zoom ourselves */
    user-select: none;
    -webkit-user-select: none;
  }
  .lightbox.is-open{
    opacity: 1;
    visibility: visible;
    transition: opacity 0.3s ease;
  }
  /* The stage holds two photos stacked on top of each other: the current one
     (#lb-img, on top) and the next/previous one waiting underneath (#lb-under).
     Swiping drags the top photo away to reveal the one behind it. */
  .lightbox-stage{
    position: relative;
    width: min(92vw, 1400px);
    height: 82vh;
  }
  .lightbox-img{
    position: absolute;
    inset: 0;
    margin: auto;               /* centres the photo inside the stage */
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    background: #fff;
    padding: 0.35rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    transform-origin: center center;
    will-change: transform;
    -webkit-user-drag: none;
  }
  .lightbox-under{
    opacity: 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .lightbox-img.is-zoomed{ cursor: grab; }

  .lightbox-btn{
    position: absolute;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 9999px;
    border: 1.5px solid rgba(255,255,255,0.35);
    background: rgba(253,248,246,0.12);
    color: var(--cream);
    cursor: pointer;
    transition: background-color 0.25s ease, transform 0.25s cubic-bezier(0.34,1.4,0.64,1);
  }
  .lightbox-btn:hover{ background: rgba(253,248,246,0.28); transform: scale(1.06); }
  .lightbox-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .lightbox-btn svg{ width: 22px; height: 22px; }
  .lightbox-close{ top: 1rem; right: 1rem; }
  .lightbox-prev{ left: 1rem; top: 50%; transform: translateY(-50%); }
  .lightbox-next{ right: 1rem; top: 50%; transform: translateY(-50%); }
  .lightbox-prev:hover, .lightbox-next:hover{ transform: translateY(-50%) scale(1.06); }

  .lightbox-counter{
    position: absolute;
    bottom: 1.1rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(253,248,246,0.8);
    font-size: 0.85rem;
    letter-spacing: 0.2em;
  }

  /* Phones: arrows sit at the bottom beside the counter, out of the photo's way
     (swiping is the main way to move there anyway) */
  @media (max-width: 767px){
    .lightbox-prev, .lightbox-next{ top: auto; bottom: 0.6rem; transform: none; width: 44px; height: 44px; }
    .lightbox-prev:hover, .lightbox-next:hover{ transform: scale(1.06); }
    .lightbox-prev{ left: 1.5rem; }
    .lightbox-next{ right: 1.5rem; }
    .lightbox-stage{ width: calc(100vw - 2rem); height: 78vh; }
  }

  body.lightbox-open{ overflow: hidden; }

  @media (prefers-reduced-motion: reduce){
    .gallery-item, .gallery-item img, .lightbox, .lightbox-img{ opacity: 1; transform: none; transition: none; }
    .lightbox:not(.is-open){ opacity: 0; }
  }
</style>
</head>
<body>

  <!-- "../" = the site's home page (one folder up from /prenup/) -->
  <a href="../" class="back-btn" aria-label="Back to the home page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Home
  </a>

  <header class="page-header">
    <p class="page-label">Sydney · May 2026</p>
    <h1 class="page-title">Our Prenup</h1>
  </header>

  <main class="gallery" id="gallery"></main>
  <p class="gallery-empty" id="gallery-empty" hidden>Photos coming soon.</p>

  <!-- Expanded photo viewer: opens when a photo is clicked/tapped -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <button type="button" class="lightbox-btn lightbox-close" id="lb-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="button" class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="lightbox-stage">
      <img class="lightbox-img lightbox-under" id="lb-under" alt="" aria-hidden="true" />
      <img class="lightbox-img" id="lb-img" alt="" />
    </div>
    <button type="button" class="lightbox-btn lightbox-next" id="lb-next" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <p class="lightbox-counter" id="lb-counter"></p>
  </div>

<script>
  // ============================================================
  //  EDIT THIS LIST: one line per photo in photos/gallery/.
  //  Order here = order on the page. Names must match exactly,
  //  including upper/lower case and the extension (.jpg vs .jpeg).
  // ============================================================
    const PRENUP_PHOTOS = [
    'DSC04092.jpeg',
    'DSC04131.jpeg',
    'DSC04147.jpeg',
    'DSC04204.jpeg',
    'DSC04225.jpeg',
    'DSC04236.jpeg',
    'DSC04239.jpeg',
    'DSC04268.jpeg',
    'DSC04315.jpeg',
    'DSC04384.jpeg',
    'DSC04415.jpeg',
    'DSC04485.jpeg',
    'DSC04520.jpeg',
    'DSC04551.jpeg',
    'DSC04630.jpeg',
    'DSC04689.jpeg',
    'DSC04733.jpeg',
    'DSC04782.jpeg',
    'DSC04785.jpeg',
    'DSC04814.jpeg',
    'DSC04855.jpeg',
    'DSC04887.jpeg',
    'DSC04888.jpeg',
    'DSC04950.jpeg',
    'DSC04962.jpeg',
    'DSC04978.jpeg',
    'DSC05001.jpeg',
    'DSC05006.jpeg',
    'DSC05014.jpeg',
    'DSC05033.jpeg',
    'DSC05068.jpeg',
    'DSC05084.jpeg',
    'DSC05101.jpeg',
    'DSC05137.jpeg',
    'DSC05267.jpeg',
    'DSC05268.jpeg',
    'DSC05301.jpeg',
    'DSC05327.jpeg',
    'DSC05423.jpeg',
    'DSC05542.jpeg',
    'DSC05560.jpeg',
    'DSC05638.jpeg',
    'DSC05735.jpeg',
    'DSC05768.jpeg',
    'DSC05816.jpeg',
    'DSC05841.jpeg',
    'DSC05909.jpeg',
    'DSC05923.jpeg',
    'DSC06009.jpeg',
    'DSC06177.jpeg',
    'DSC06195.jpeg',
    'DSC06262.jpeg',
    'DSC06317.jpeg',
    'DSC06360.jpeg'
  ];

  const gallery = document.getElementById('gallery');

  PRENUP_PHOTOS.forEach((file, i) => {
    const item = document.createElement('figure');
    item.className = 'gallery-item';
    item.tabIndex = 0;                      // keyboard users can Tab to photos
    item.setAttribute('role', 'button');
    item.setAttribute('aria-label', 'Open photo ' + (i + 1));
    const img = document.createElement('img');
    img.src = '../photos/gallery/thumbs/' + file;       // small copy for the grid
    img.dataset.full = '../photos/gallery/' + file;      // full size for the expanded view
    img.alt = 'Atom and Joanne prenup photo ' + (i + 1);
    img.loading = i < 6 ? 'eager' : 'lazy';
    // Hide any photo whose file name is wrong instead of showing a broken icon
    img.onerror = () => item.remove();
    // Portrait photo? Make it two rows tall
    img.onload = () => item.classList.toggle('is-portrait', img.naturalHeight > img.naturalWidth);
    item.appendChild(img);
    gallery.appendChild(item);
  });

  if (!PRENUP_PHOTOS.length) document.getElementById('gallery-empty').hidden = false;

  // ---------- Row height ----------
  // One row = the height of a 3:2 landscape photo at the current column width
  // (plus its white border), so landscapes show uncropped and two of them
  // stacked (with the gap between) match one portrait exactly.
  function sizeRows(){
    const first = gallery.querySelector('.gallery-item');
    if (!first) return;
    const pad = parseFloat(getComputedStyle(first).paddingTop) || 0;
    const colW = first.getBoundingClientRect().width;
    gallery.style.gridAutoRows = ((colW - pad * 2) * 2 / 3 + pad * 2) + 'px';
  }
  sizeRows();
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(sizeRows, 100); });

  // Gentle fade-up as photos scroll into view
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.gallery-item').forEach((el) => io.observe(el));

  // ---------- Lightbox: click a photo to expand, then browse ----------
  // Click/tap = open. In the viewer:
  //   • swipe left/right (phone): next / previous
  //   • pinch with two fingers, or double-tap: zoom in; drag to look around
  //   • arrow buttons / ← → keys: next / previous
  //   • Esc / X / tapping the dark background: close
  // Wraps around at the ends.
  const lb = document.getElementById('lightbox');
  const lbStage = lb.querySelector('.lightbox-stage');
  const lbImg = document.getElementById('lb-img');
  const lbUnder = document.getElementById('lb-under');
  const lbCounter = document.getElementById('lb-counter');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
  let lbIndex = 0;
  let lastFocused = null;
  let animating = false;

  // Zoom/pan state for the top photo, plus how far it's being dragged sideways
  let scale = 1, tx = 0, ty = 0, dragX = 0;

  // Read the photos from the page each time, so any removed (broken) ones are skipped
  const photoEls = () => Array.from(gallery.querySelectorAll('.gallery-item img'));
  const wrap = (i, n) => (i + n) % n;

  function setTransition(el, on, ms){
    el.style.transition = on && !reduceMotion
      ? `transform ${ms || 350}ms ${EASE}, opacity ${ms || 350}ms ease`
      : 'none';
  }

  // Draw the current state onto both photos
  function render(){
    const rot = dragX * 0.03;                                   // slight tilt while dragging
    lbImg.style.transform = `translate(${dragX + tx}px, ${ty}px) rotate(${rot}deg) scale(${scale})`;
    const w = lbStage.clientWidth || 1;
    const p = Math.min(Math.abs(dragX) / w, 1);                 // 0 → 1 as the top photo leaves
    lbUnder.style.transform = `scale(${0.9 + 0.1 * p})`;
    lbUnder.style.opacity = dragX === 0 ? 0 : String(0.35 + 0.65 * p);
    lbImg.classList.toggle('is-zoomed', scale > 1.01);
  }

  function resetZoom(){ scale = 1; tx = 0; ty = 0; }

  // Keep a zoomed photo from being dragged off into empty space
  function clampPan(){
    const w = lbImg.offsetWidth, h = lbImg.offsetHeight;
    const maxX = Math.max(0, (w * scale - lbStage.clientWidth) / 2);
    const maxY = Math.max(0, (h * scale - lbStage.clientHeight) / 2);
    tx = Math.max(-maxX, Math.min(maxX, tx));
    ty = Math.max(-maxY, Math.min(maxY, ty));
    if (scale <= 1){ tx = 0; ty = 0; }
  }

  // Put photo i on top, and prepare the one underneath for the given direction
  function setTop(i){
    const photos = photoEls();
    if (!photos.length) return;
    lbIndex = wrap(i, photos.length);
    lbImg.src = photos[lbIndex].dataset.full;
    lbImg.alt = photos[lbIndex].alt;
    lbCounter.textContent = (lbIndex + 1) + ' / ' + photos.length;
    // Preload neighbours so the photo underneath is ready the moment you swipe
    [lbIndex + 1, lbIndex - 1].forEach((n) => { const pre = new Image(); pre.src = photos[wrap(n, photos.length)].dataset.full; });
  }
  function prepareUnder(dir){            // dir: +1 = next, -1 = previous
    const photos = photoEls();
    const src = photos[wrap(lbIndex + dir, photos.length)].src;
    if (lbUnder.src !== src) lbUnder.src = src;
  }

  // Change photo with a quick fade (same as before the swipe-reveal experiment)
  function commit(dir){
    if (animating) return;
    if (photoEls().length < 2) return;
    animating = true;
    resetZoom();
    dragX = 0;
    setTransition(lbImg, true, 100);
    lbImg.style.opacity = '0';
    const swap = () => {
      setTransition(lbImg, false);
      setTop(lbIndex + dir);
      render();
      requestAnimationFrame(() => {
        setTransition(lbImg, true, 100);
        lbImg.style.opacity = '1';
        animating = false;
      });
    };
    if (reduceMotion) { swap(); lbImg.style.opacity = '1'; } else setTimeout(swap, 100);
  }

  function snapBack(){
    setTransition(lbImg, true, 300);
    setTransition(lbUnder, true, 300);
    dragX = 0;
    clampPan();
    render();
  }

  function openLightbox(i){
    lastFocused = document.activeElement;
    resetZoom(); dragX = 0;
    setTransition(lbImg, false); setTransition(lbUnder, false);
    setTop(i);
    render();
    lb.classList.add('is-open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lightbox-open');
    document.getElementById('lb-close').focus({ preventScroll: true });
  }

  function closeLightbox(){
    lb.classList.remove('is-open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lightbox-open');
    if (lastFocused) lastFocused.focus({ preventScroll: true });
  }

  const next = () => commit(+1);
  const prev = () => commit(-1);

  gallery.addEventListener('click', (e) => {
    const item = e.target.closest('.gallery-item');
    if (!item) return;
    openLightbox(Array.from(gallery.querySelectorAll('.gallery-item')).indexOf(item));
  });
  gallery.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const item = e.target.closest('.gallery-item');
    if (!item) return;
    e.preventDefault();
    openLightbox(Array.from(gallery.querySelectorAll('.gallery-item')).indexOf(item));
  });

  document.getElementById('lb-next').addEventListener('click', (e) => { e.stopPropagation(); next(); });
  document.getElementById('lb-prev').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
  document.getElementById('lb-close').addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });

  // Tapping the dark background (not the photo or buttons) closes it
  lb.addEventListener('click', (e) => {
    if (e.target === lb || e.target === lbStage) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('is-open')) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'Escape') closeLightbox();
  });

  // ---------- Touch gestures: swipe, pinch-zoom, pan, double-tap ----------
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });
  const stageCenter = () => {
    const r = lbStage.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };

  let mode = null;                 // 'swipe' | 'pan' | 'pinch'
  let start = null;                // gesture starting values
  let lastTap = 0;

  lb.addEventListener('touchstart', (e) => {
    if (animating) return;
    setTransition(lbImg, false);
    setTransition(lbUnder, false);
    if (e.touches.length === 2){
      // Two fingers: pinch to zoom around the point between them
      const m = mid(e.touches[0], e.touches[1]);
      const c = stageCenter();
      mode = 'pinch';
      dragX = 0;
      start = {
        d: dist(e.touches[0], e.touches[1]),
        s: scale,
        // the photo point under the fingers, so it stays under them while zooming
        ux: (m.x - c.x - tx) / scale,
        uy: (m.y - c.y - ty) / scale,
      };
    } else if (e.touches.length === 1){
      const t = e.touches[0];
      mode = scale > 1.01 ? 'pan' : 'swipe';
      start = { x: t.clientX, y: t.clientY, tx, ty, time: Date.now(), dir: null };
    }
  }, { passive: true });

  lb.addEventListener('touchmove', (e) => {
    if (!mode || animating) return;
    if (e.cancelable) e.preventDefault();          // stop the page from scrolling/zooming
    if (mode === 'pinch' && e.touches.length === 2){
      const m = mid(e.touches[0], e.touches[1]);
      const c = stageCenter();
      scale = Math.min(4, Math.max(1, start.s * dist(e.touches[0], e.touches[1]) / start.d));
      tx = m.x - c.x - scale * start.ux;
      ty = m.y - c.y - scale * start.uy;
      clampPan();
      render();
    } else if (mode === 'pan' && e.touches.length === 1){
      const t = e.touches[0];
      tx = start.tx + (t.clientX - start.x);
      ty = start.ty + (t.clientY - start.y);
      clampPan();
      render();
    } else if (mode === 'swipe' && e.touches.length === 1){
      const t = e.touches[0];
      const dx = t.clientX - start.x, dy = t.clientY - start.y;
      if (!start.dir && Math.hypot(dx, dy) > 8) start.dir = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      // (photo stays put while swiping; the change happens on release)
    }
  }, { passive: false });

  lb.addEventListener('touchend', (e) => {
    if (!mode || animating) return;

    if (mode === 'pinch'){
      if (scale < 1.05) resetZoom();
      clampPan();
      setTransition(lbImg, true, 250);
      render();
      // one finger still down → keep panning from here
      if (e.touches.length === 1){
        const t = e.touches[0];
        mode = scale > 1.01 ? 'pan' : null;
        start = { x: t.clientX, y: t.clientY, tx, ty, time: Date.now(), dir: null };
      } else mode = null;
      return;
    }

    const t = e.changedTouches[0];
    const moved = Math.hypot(t.clientX - start.x, t.clientY - start.y);

    // Double-tap: zoom in to that spot, or back out if already zoomed
    if (moved < 10 && e.target === lbImg){
      const now = Date.now();
      if (now - lastTap < 300){
        lastTap = 0;
        setTransition(lbImg, true, 300);
        if (scale > 1.01){ resetZoom(); }
        else {
          const c = stageCenter();
          scale = 2.5;
          tx = -(scale - 1) * (t.clientX - c.x);
          ty = -(scale - 1) * (t.clientY - c.y);
          clampPan();
        }
        render();
        mode = null;
        return;
      }
      lastTap = now;
    }

    // Swipe: a mostly-sideways swipe of 40px+ changes the photo
    if (mode === 'swipe' && start.dir === 'x'){
      const dx = t.clientX - start.x;
      if (Math.abs(dx) > 40) commit(dx < 0 ? +1 : -1);
    }
    mode = null;
  }, { passive: true });

  lb.addEventListener('touchcancel', () => { mode = null; snapBack(); }, { passive: true });
</script>
</body>
</html>
